[package]
name = "eratos"
version = "0.1.1"
description = "A CPU benchmark built on the Sieve of Eratosthenes"
edition = "2021"
license = "BSD-3-Clause"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
num_cpus = "1.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

